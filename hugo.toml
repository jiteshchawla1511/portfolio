baseURL = "https://jiteshchawla.dev/"
title = "Jitesh's Blog"
paginate = 5
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  env = "production"
  title = "Jitesh's Blog"
  description = "Software Engineer — building things for the web."
  author = "Jitesh Chawla"
  DateFormat = "January 2, 2006"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  disableScrollToTop = false
  comments = false
  mainSections = []

  # profileMode DISABLED — home is text-only now
  [params.profileMode]
    enabled = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jiteshchawla1511"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/jitesh-chawla-01870a152/"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/Jitesh_1511"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:jiteshchawla1511@gmail.com"

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 5

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 10

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  url = "/posts/"
  weight = 30

[[menu.main]]
  identifier = "books"
  name = "Books"
  url = "/books/"
  weight = 35

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "🔍"
  url = "/search/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
